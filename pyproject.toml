[project]
name = "codeagent"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
# Pins the test-runner dependency to the exact version this project's
# test suite is developed and verified against (see
# .github/workflows/ci.yml). This pins pytest itself, not a full
# reproducible install: no hashes, no transitive-dependency lockfile.
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# tests/fixtures/retry_worker/tests/ is a fixture-owned package meant
# only to run inside the verification container (see executor.py's
# DEFAULT_COMMAND) via `python3 -m unittest tests.test_worker`. Its own
# tests/__init__.py collides with the real top-level tests package if
# pytest collects it on the host, so it's excluded here.
norecursedirs = ["tests/fixtures"]
